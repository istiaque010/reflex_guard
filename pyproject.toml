[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex-guard"
version = "1.0.0"
description = "A low-latency embedding-based guardrail for LLM prompt safety"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["llm-safety", "guardrail", "jailbreak-detection", "prompt-injection", "sentence-embeddings"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.2",
    "scipy>=1.10",
    "joblib>=1.3",
    "pyarrow>=12.0",
]

[project.optional-dependencies]
# Needed to actually embed anything. Kept optional so the metrics and
# preprocessing modules stay importable (and testable) without torch.
embed = [
    "sentence-transformers>=2.2",
    "transformers>=4.35",
    "torch>=2.0",
]
boosting = [
    "xgboost>=2.0",
    "lightgbm>=4.0",
]
data = [
    "datasets>=2.14",
]
quantize = [
    "onnx>=1.15",
    "onnxruntime>=1.16",
    "optimum[onnxruntime]>=1.16",
]
figures = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "ruff>=0.1"]
all = [
    "reflex-guard[embed,boosting,data,quantize,figures,dev]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # long lines: tables and docstrings read better unwrapped
    "E702",   # `_sync(); t0 = perf_counter()` pairs must stay on one line
]
